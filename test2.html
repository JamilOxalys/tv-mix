<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Mix test 2</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font-family: -apple-system, "Samsung One", Arial, sans-serif; overflow: hidden; }
  img.bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #music { position: fixed; left: 3vw; bottom: 3vw; width: 40vw; height: 26vw; border-radius: 12px; overflow: hidden; }
  #music iframe { width: 100%; height: 100%; border: 0; }
  #note { position: fixed; top: 2vw; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: 1vw 2vw; border-radius: 1vw; font-size: 1.3vw; text-align: center; max-width: 70vw; }
  #state { color: #fbbf24; }
</style>
</head>
<body>
  <!-- An animated image (not a video player), to see whether the TV lets it move while Apple Music plays. -->
  <img class="bg" src="videos/mansion.webp" alt="">
  <div id="note">Test: press <b>Play</b> in Apple's player. Does the mansion video keep moving while the music plays?<br>
    <span id="state">(This one is an animated picture, not a video.)</span></div>
  <div id="music">
    <iframe src="https://embed.music.apple.com/gb/playlist/halloween-party-2026/pl.u-MDAWvVDt4JJEYY"
      allow="autoplay *; encrypted-media *; fullscreen *; clipboard-write"
      sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-storage-access-by-user-activation"></iframe>
  </div>
</body>
</html>
