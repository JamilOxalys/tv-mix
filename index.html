<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>TV Mix</title>
<link rel="icon" href="icon.png">
<!-- Start connecting to YouTube straight away, so the first video and thumbnails arrive sooner. -->
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://i.ytimg.com">
<style>
  :root {
    --bg: #000;
    --panel: rgba(12, 12, 16, 0.8);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --accent: #fa2d48;
    --focus: #ffffff;
    --u: 1vw;  /* 1% of the 16:9 frame's width, set exactly by sizeStage() */
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  /* Everything lives in a 16:9 frame, centred with black bars if the screen isn't 16:9.
     The transform also makes the fixed-position layers below fill the frame, not the window. */
  #stage {
    position: fixed; left: 50%; top: 50%;
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    transform: translate(-50%, -50%);
    overflow: hidden; background: #000;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Samsung One", "Helvetica Neue", Arial, sans-serif;
    font-size: calc(1.4 * var(--u));
  }

  /* The video. The player is made taller than the frame so YouTube's title bar, logo and pop-ups
     land outside it and get cut off; the picture fills the frame exactly. */
  #video-wrap { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  #video-wrap iframe, #yt { position: absolute; left: 0; top: -20%; width: 100%; height: 140%; }
  /* 4K: the player is laid out at twice the size and scaled back down, so YouTube sees a 4K-sized
     player and offers its 2160p stream (TV browsers usually report a 1920-wide screen even on 4K TVs). */
  .render4k #video-wrap iframe, .render4k #yt { width: 200%; height: 280%; transform: scale(.5); transform-origin: 0 0; }

  /* While a video loads, a still frame from it covers the screen (a picture, not a video, so the TV
     allows it), and fades away once the video is playing smoothly and sharply. */
  #cover {
    position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover;
    background: #000; opacity: 1; transition: opacity .5s ease; pointer-events: none;
  }
  #cover.off { opacity: 0; }

  /* Invisible layer over the video so hovering or clicking can never bring up YouTube's own controls. */
  #shield { position: fixed; inset: 0; }

  /* The small controls in the bottom right; they appear on a key press and fade after a few seconds. */
  #buttons {
    position: fixed; right: calc(2.2 * var(--u)); bottom: calc(2.2 * var(--u));
    display: flex; gap: calc(.6 * var(--u)); align-items: center; transition: opacity .5s;
  }
  body.idle #buttons { opacity: 0; }
  #buttons button { font-size: calc(.85 * var(--u)); padding: calc(.45 * var(--u)) calc(.9 * var(--u)); border-radius: calc(.5 * var(--u)); border-width: calc(.15 * var(--u)); }

  button, input, textarea {
    font: inherit; color: var(--text);
    background: var(--panel); border: calc(.2 * var(--u)) solid transparent;
    border-radius: calc(.8 * var(--u)); padding: calc(.8 * var(--u)) calc(1.4 * var(--u)); outline: none;
  }
  button { cursor: pointer; }
  button:focus, button:hover, input:focus, textarea:focus {
    border-color: var(--focus); box-shadow: 0 0 calc(1.2 * var(--u)) rgba(255,255,255,.35);
  }
  button.primary { background: var(--accent); }

  #settings {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.75);
  }
  #settings.open { display: flex; }
  #settings .box { background: #18181b; padding: calc(2.5 * var(--u)) calc(3 * var(--u)); border-radius: calc(1.2 * var(--u)); width: calc(70 * var(--u)); max-height: calc(52 * var(--u)); overflow-y: auto; display: flex; flex-direction: column; gap: calc(.8 * var(--u)); }
  #settings h2 { margin: 0; font-size: calc(1.8 * var(--u)); }
  #settings label { color: var(--muted); font-size: calc(1.1 * var(--u)); margin-top: calc(.6 * var(--u)); }
  #settings input, #settings textarea { width: 100%; background: #27272a; }
  #settings textarea { height: 9em; resize: vertical; line-height: 1.4; font-size: calc(1.1 * var(--u)); }
  #settings input[type=number] { width: calc(10 * var(--u)); }
  #settings .err { color: #f87171; font-size: calc(1.1 * var(--u)); min-height: calc(1.3 * var(--u)); }
  .row { display: flex; gap: calc(1 * var(--u)); align-items: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="video-wrap"><div id="yt"></div></div>
  <img id="cover" alt="">
  <div id="shield"></div>

  <div id="buttons">
    <button id="btn-next">Next video</button>
    <button id="btn-fullscreen" hidden>Full screen</button>
    <button id="btn-settings">Settings</button>
  </div>

  <div id="settings">
    <div class="box">
      <h2>Settings</h2>
      <label for="videos-input">YouTube videos, one link per line (always muted)</label>
      <textarea id="videos-input" placeholder="https://www.youtube.com/watch?v=…&#10;https://youtu.be/…"></textarea>

      <div class="row">
        <label for="minutes-input" style="margin:0">Minutes per video</label>
        <input id="minutes-input" type="number" min="0.5" step="0.5">
      </div>

      <label id="quality-info" style="margin:0"></label>
      <div class="err" id="settings-err"></div>
      <div class="row">
        <button id="btn-save" class="primary">Save</button>
        <button id="btn-close">Cancel</button>
        <button id="btn-signin">Sign in to YouTube</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const CFG = window.TVMIX_CONFIG || {};
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);

  function sizeStage() {
    const w = Math.min(innerWidth, innerHeight * 16 / 9);
    document.documentElement.style.setProperty("--u", w / 100 + "px");
  }
  sizeStage();
  addEventListener("resize", sizeStage);

  // localStorage can throw in some TV browsers / private modes.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    getJSON(k) { try { return JSON.parse(this.get(k)); } catch { return null; } },
  };
  // Problems are only logged, never shown over the video.
  const log = (msg) => console.warn("TV Mix:", msg);

  // ---------- Videos ----------

  function parseVideoId(input) {
    if (!input) return null;
    input = input.trim();
    if (/^[\w-]{11}$/.test(input)) return input;
    const m = input.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);
    return m ? m[1] : null;
  }
  // Pulls every video ID out of a list or block of text, dropping duplicates.
  function parseVideoList(items) {
    const ids = [].concat(items || []).flatMap((s) => String(s).split(/[\s,]+/)).map(parseVideoId).filter(Boolean);
    return [...new Set(ids)];
  }

  const fromUrl = params.get("v") ? parseVideoList(params.get("v").split(",")) : [];
  let videos = fromUrl.length ? fromUrl : (store.getJSON("tvmix.videos") || parseVideoList(CFG.videos));
  let minutesPerVideo = Number(store.get("tvmix.minutes")) || CFG.minutesPerVideo || 10;
  const render4k = CFG.render4k !== false;
  if (render4k) document.body.classList.add("render4k");

  // How far into each video we got, so each one carries on where it left off (kept across restarts).
  const resumeAt = store.getJSON("tvmix.resumeAt") || {};

  // One player only: the Samsung TV browser can play just one video at a time, so a second,
  // preloading player would freeze the one on screen.
  let player = null;
  let currentId = null;     // the video on screen (or loading)
  let switching = false;    // true while the cover is up and a video is getting ready
  let switchTimer = null;
  let failedInARow = 0;
  const startedAt = Date.now();

  // YouTube shows its own pause button for about 5 seconds after a video starts moving,
  // so the cover stays up until then...
  const SETTLE_MS = 5000;
  // ...and until the picture is sharp (1080p, or the video's best if lower). If YouTube stops stepping up
  // before that (a slower connection), it reveals once the quality has held steady for a moment.
  // Where a video has 4K, YouTube steps up to it on its own a few seconds after the reveal.
  const REVEAL_QUALITY = "hd1080";
  const STEADY_MS = 1500;
  const MAX_COVER_MS = 12000;
  const QUALITY_ORDER = ["tiny", "small", "medium", "large", "hd720", "hd1080", "hd1440", "hd2160", "highres"];
  const rank = (q) => QUALITY_ORDER.indexOf(q);
  const QUALITY_NAMES = { hd2160: "4K (2160p)", highres: "above 4K", hd1440: "1440p", hd1080: "1080p", hd720: "720p", large: "480p", medium: "360p", small: "240p", tiny: "144p" };

  // In Settings: the picture quality now playing, and the best this video offers.
  function showQuality() {
    let now = "", best = "";
    try {
      now = player.getPlaybackQuality();
      best = player.getAvailableQualityLevels().filter((q) => q !== "auto").sort((a, b) => rank(b) - rank(a))[0] || "";
    } catch (e) {}
    $("quality-info").textContent = now && QUALITY_NAMES[now]
      ? "Playing in " + QUALITY_NAMES[now] + (best && QUALITY_NAMES[best] ? " · best this video offers: " + QUALITY_NAMES[best] : "")
      : "";
  }

  // The video after `id` in the list (wraps round). If `id` isn't in the list, the first one.
  function nextAfter(id) {
    const i = videos.indexOf(id);
    return videos[(i + 1) % videos.length];
  }

  function silence() { try { player.mute(); player.setVolume(0); } catch {} }
  // Captions can still appear if the viewer's YouTube settings turn them on, so switch them off every time.
  function hideCaptions() { try { player.unloadModule("captions"); player.unloadModule("cc"); } catch {} }

  // A still of each video: one of YouTube's automatic frames from inside it (not the uploader's
  // thumbnail, which often has a title written on it). Fetched ahead, so the cover appears instantly.
  const STILL_SIZES = ["maxres2", "sd2", "hq2"];
  const stillUrl = (id, i = 0) => `https://i.ytimg.com/vi/${id}/${STILL_SIZES[i]}.jpg`;
  const prefetched = {};
  function prefetchStill(id) {
    if (!id || prefetched[id]) return;
    const img = new Image();
    let i = 0;
    img.onerror = () => { if (++i < STILL_SIZES.length) img.src = stillUrl(id, i); };
    img.onload = () => { prefetched[id] = img.src; };
    img.src = stillUrl(id);
  }

  // Put the still of `id` over the screen. Resolves once it's showing.
  function coverWith(id) {
    return new Promise((resolve) => {
      const img = $("cover");
      let tries = 0, done = false;
      const finish = () => { if (done) return; done = true; img.classList.remove("off"); setTimeout(resolve, 550); };
      img.onload = finish;
      img.onerror = () => { if (++tries < STILL_SIZES.length) img.src = stillUrl(id, tries); else { img.removeAttribute("src"); finish(); } };
      img.src = prefetched[id] || stillUrl(id);
      if (img.complete && img.naturalWidth) finish();
      setTimeout(finish, 1500);
    });
  }

  // Wait until the video is past YouTube's pause-button moment and as sharp as it's going to get.
  function whenSettled(id) {
    return new Promise((resolve) => {
      const began = Date.now();
      let playingSince = 0, lastQuality = "", qualitySince = Date.now();
      (function check() {
        if (currentId !== id) return resolve(false);
        const playing = player.getPlayerState && player.getPlayerState() === YT.PlayerState.PLAYING;
        playingSince = playing ? (playingSince || Date.now()) : 0;
        const quality = (player.getPlaybackQuality && player.getPlaybackQuality()) || "";
        if (quality !== lastQuality) { lastQuality = quality; qualitySince = Date.now(); }
        const levels = (player.getAvailableQualityLevels && player.getAvailableQualityLevels()) || [];
        const best = levels.map(rank).filter((r) => r >= 0);
        const target = Math.min(best.length ? Math.max(...best) : rank(REVEAL_QUALITY), rank(REVEAL_QUALITY));
        const sharp = rank(quality) >= target;
        const steady = Date.now() - qualitySince >= STEADY_MS;
        const settled = playingSince && Date.now() - playingSince >= SETTLE_MS;
        if ((settled && (sharp || steady)) || Date.now() - began > MAX_COVER_MS) return resolve(true);
        setTimeout(check, 200);
      })();
    });
  }

  // Show a video: cover the screen with its thumbnail, load it underneath, reveal it once it's ready.
  async function play(id) {
    if (!player || !id) return;
    clearTimeout(switchTimer);
    rememberPosition();
    switching = true;
    await coverWith(id);
    currentId = id;
    store.set("tvmix.current", id);
    player.loadVideoById({ videoId: id, startSeconds: resumeAt[id] || 0 });
    silence();
    if (!(await whenSettled(id))) return;  // something else took over meanwhile
    $("cover").classList.add("off");
    switching = false;
    scheduleSwitch();
    prefetchStill(nextAfter(id));
  }

  function nextVideo() {
    if (!videos.length) return log("No videos set. Open Settings to add some.");
    // A browser left running for days gets sluggish, so every few hours reload the page between videos.
    // Where it was is saved, so it carries straight on.
    const hours = CFG.refreshEveryHours ?? 6;
    if (hours > 0 && Date.now() - startedAt > hours * 3600e3) {
      rememberPosition();
      store.set("tvmix.current", nextAfter(currentId));
      return location.reload();
    }
    play(nextAfter(currentId));
  }

  function scheduleSwitch() {
    clearTimeout(switchTimer);
    if (videos.length > 1) switchTimer = setTimeout(nextVideo, minutesPerVideo * 60e3);
  }

  function rememberPosition() {
    if (!player || !currentId || switching || !player.getCurrentTime) return;
    const data = player.getVideoData ? player.getVideoData() : null;
    if (data && data.video_id && data.video_id !== currentId) return;
    const t = player.getCurrentTime(), d = player.getDuration();
    // Start over next time if we were near the end (or it's a live stream).
    resumeAt[currentId] = d && t < d - 30 ? t : 0;
    store.set("tvmix.resumeAt", JSON.stringify(resumeAt));
  }
  setInterval(rememberPosition, 30e3);

  // Keep things going on a display that's left alone:
  //  - if the browser pauses the video, start it again;
  //  - if it stalls (stuck buffering or frozen) for 45 seconds, move on to the next video.
  let lastTime = -1, stuckSince = Date.now();
  setInterval(() => {
    if (!player || !player.getPlayerState || switching || !currentId || document.visibilityState !== "visible") return;
    const st = player.getPlayerState();
    if (st === YT.PlayerState.PAUSED || st === YT.PlayerState.CUED || st === YT.PlayerState.UNSTARTED) player.playVideo();
    const t = player.getCurrentTime();
    if (t !== lastTime) { lastTime = t; stuckSince = Date.now(); return; }
    if (Date.now() - stuckSince > 45e3) {
      log("Video stalled, moving on.");
      stuckSince = Date.now();
      play(videos.length > 1 ? nextAfter(currentId) : currentId);
    }
  }, 3000);

  function startFirst() {
    if (!videos.length) return log("No videos set. Open Settings to add some.");
    const saved = store.get("tvmix.current");
    play(videos.includes(saved) ? saved : videos[0]);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("yt", {
      // The normal YouTube player, so a YouTube sign-in on this TV counts (Premium: no ads).
      host: "https://www.youtube.com",
      playerVars: {
        autoplay: 0, mute: 1, controls: 0, playsinline: 1, rel: 0, disablekb: 1,
        iv_load_policy: 3, fs: 0, cc_load_policy: 0, origin: location.origin,
        vq: render4k ? "hd2160" : "hd1080",  // a hint only; YouTube makes the final choice
      },
      events: {
        onReady: () => {
          silence();
          // Keep the remote's focus out of the YouTube player, or its own controls pop up on key presses.
          try { player.getIframe().tabIndex = -1; } catch {}
          startFirst();
        },
        onStateChange: (e) => {
          silence();  // re-assert mute in case anything unmuted it
          if (e.data === YT.PlayerState.PLAYING) { hideCaptions(); failedInARow = 0; }
          // A video that finishes before its time is up moves on to the next one (from its start next time).
          if (e.data === YT.PlayerState.ENDED && !switching) {
            resumeAt[currentId] = 0;
            store.set("tvmix.resumeAt", JSON.stringify(resumeAt));
            play(videos.length > 1 ? nextAfter(currentId) : currentId);
          }
        },
        onError: (e) => {
          const blocked = e.data === 101 || e.data === 150 || e.data === 153;
          log(blocked ? `Video ${currentId} can't be played outside YouTube; skipping it.` : `Video ${currentId} couldn't load (error ${e.data}); skipping it.`);
          const failed = currentId;
          currentId = null;  // stops the current reveal from finishing
          switching = false;
          // If every video fails (e.g. the internet is down), wait a minute and start again.
          if (++failedInARow >= videos.length) { failedInARow = 0; return setTimeout(() => play(nextAfter(failed)), 60e3); }
          play(nextAfter(failed));
        },
      },
    });
  };

  const ytScript = document.createElement("script");
  ytScript.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(ytScript);
  // If YouTube couldn't be reached at all (e.g. the TV came on before the Wi-Fi), try again in a minute.
  setTimeout(() => { if (!player) location.reload(); }, 60e3);

  // Ask the browser not to let the screen dim or sleep while this is showing.
  async function keepAwake() { try { await navigator.wakeLock.request("screen"); } catch {} }
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });

  // ---------- Settings ----------

  const settingsOpen = () => $("settings").classList.contains("open");

  function openSettings() {
    $("videos-input").value = videos.map((id) => "https://youtu.be/" + id).join("\n");
    $("minutes-input").value = minutesPerVideo;
    $("settings-err").textContent = "";
    showQuality();
    $("settings").classList.add("open");
    $("videos-input").focus();
  }
  function closeSettings() { $("settings").classList.remove("open"); $("btn-settings").focus(); wake(); }

  $("btn-settings").onclick = openSettings;
  $("btn-close").onclick = closeSettings;
  // A one-time sign-in on Google's own page. The TV keeps it, so YouTube Premium applies to the videos here.
  // Afterwards press Back (or reopen TV Mix) to come back.
  // Inside the Samsung app TV Mix is in a frame, where Google won't show its sign-in page, so the app opens it instead.
  $("btn-signin").onclick = () => {
    rememberPosition();
    if (window.self !== window.top) { parent.postMessage("tvmix:signin", "*"); return; }
    location.href = "https://accounts.google.com/ServiceLogin?service=youtube&continue=" +
      encodeURIComponent("https://www.youtube.com/signin?action_handle_signin=true&next=%2F");
  };
  $("btn-save").onclick = () => {
    const err = (msg) => ($("settings-err").textContent = msg);
    const lines = $("videos-input").value.split("\n").map((s) => s.trim()).filter(Boolean);
    const bad = lines.filter((l) => !parseVideoId(l));
    if (bad.length) return err("This doesn't look like a YouTube link: " + bad[0]);
    const newVideos = parseVideoList(lines);
    if (!newVideos.length) return err("Add at least one YouTube link.");
    const newMinutes = Number($("minutes-input").value);
    if (!(newMinutes >= 0.5)) return err("Minutes per video must be at least 0.5.");

    const listChanged = newVideos.join() !== videos.join();
    const minutesChanged = newMinutes !== minutesPerVideo;
    videos = newVideos; minutesPerVideo = newMinutes;
    store.set("tvmix.videos", JSON.stringify(videos));
    store.set("tvmix.minutes", String(minutesPerVideo));
    closeSettings();
    // Keep the current video if it's still in the list; otherwise start the new list from the top.
    if (listChanged && !videos.includes(currentId)) play(videos[0]);
    else if (minutesChanged && !switching) scheduleSwitch();
  };

  // ---------- Controls ----------

  let hideTimer = null;
  function wake() {
    document.body.classList.remove("idle");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => { if (!settingsOpen()) sleep(); }, (CFG.hideControlsAfter || 10) * 1000);
  }
  function sleep() {
    clearTimeout(hideTimer);
    document.body.classList.add("idle");
  }

  $("btn-next").onclick = () => { if (!switching) nextVideo(); };

  // Full screen hides the Samsung browser's bars. Browsers only allow it after a click or key press,
  // so the first press anywhere asks for it; the button is there if that didn't work.
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement;
  // Not needed inside the Samsung or Fire TV apps, which are already full screen.
  const insideApp = window.self !== window.top || /[?&]app=1/.test(location.search) || /; wv\)|AFT/.test(navigator.userAgent);
  const canFullscreen = !insideApp && !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  function goFullscreen() {
    if (!canFullscreen || fsElement()) return;
    const el = document.documentElement;
    try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => {}); } catch {}
  }
  function renderFullscreenButton() { $("btn-fullscreen").hidden = !canFullscreen || !!fsElement(); }
  if (canFullscreen) {
    $("btn-fullscreen").onclick = goFullscreen;
    document.addEventListener("fullscreenchange", renderFullscreenButton);
    document.addEventListener("webkitfullscreenchange", renderFullscreenButton);
    renderFullscreenButton();
    let asked = false;
    const firstPress = () => { if (!asked) { asked = true; goFullscreen(); } };
    document.addEventListener("keydown", firstPress, { capture: true });
    document.addEventListener("click", firstPress, { capture: true });
  }

  document.addEventListener("mousemove", wake);
  document.addEventListener("click", wake);

  // TV remote keys: any key wakes the controls, left/right move between them, Back hides them.
  const KEY = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, BACK: 10009, ESC: 27 };
  document.addEventListener("keydown", (e) => {
    if (e.keyCode === KEY.BACK || e.keyCode === KEY.ESC) {
      e.preventDefault();
      if (settingsOpen()) closeSettings(); else sleep();
      return;
    }
    const wasIdle = document.body.classList.contains("idle");
    wake();
    const buttons = [...document.querySelectorAll("#buttons button")].filter((b) => !b.hidden);
    if (wasIdle) {
      e.preventDefault();
      if (!buttons.includes(document.activeElement)) (buttons[0] || $("btn-settings")).focus();
      return;
    }
    if (!settingsOpen()) {
      if (e.keyCode === KEY.LEFT || e.keyCode === KEY.RIGHT) {
        const i = buttons.indexOf(document.activeElement);
        const next = buttons[Math.max(0, Math.min(buttons.length - 1, i + (e.keyCode === KEY.RIGHT ? 1 : -1)))];
        if (next) next.focus();
        e.preventDefault();
      }
      return;
    }
    if (e.keyCode !== KEY.UP && e.keyCode !== KEY.DOWN) return;
    // Up/down moves between the Settings fields. Inside the video list, only leave it from the first or last line.
    const el = document.activeElement;
    if (el.tagName === "TEXTAREA") {
      const atStart = !el.value.slice(0, el.selectionStart).includes("\n");
      const atEnd = !el.value.slice(el.selectionEnd).includes("\n");
      if ((e.keyCode === KEY.UP && !atStart) || (e.keyCode === KEY.DOWN && !atEnd)) return;
    }
    const fields = [$("videos-input"), $("minutes-input"), $("btn-save"), $("btn-close"), $("btn-signin")];
    const i = fields.indexOf(el);
    fields[Math.max(0, Math.min(fields.length - 1, i + (e.keyCode === KEY.DOWN ? 1 : -1)))].focus();
    e.preventDefault();
  });

  // If focus slips into the YouTube player (some TV browsers do this), take it straight back.
  addEventListener("blur", () => setTimeout(() => {
    const el = document.activeElement;
    if (el && el.tagName === "IFRAME") $("btn-next").focus();
